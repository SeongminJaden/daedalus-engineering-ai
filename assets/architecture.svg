<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 980" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Daedalus autonomous engineering loop architecture">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="978" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Daedalus: Autonomous Engineering Loop</text>
  <text x="480" y="58" text-anchor="middle" font-size="11.5" fill="#6b7280">56 registered capabilities on 13 nodes, one conjunctive verdict, one evidence ladder</text>

  <!-- goal -->
  <rect x="280" y="78" width="400" height="46" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="480" y="97" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">User Goal</text>
  <text x="480" y="114" text-anchor="middle" font-size="11.5" fill="#6b7280">constraints + objective, optionally a reference design as a prior</text>
  <line x1="480" y1="124" x2="480" y2="142" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- reasoner -->
  <rect x="280" y="144" width="400" height="46" rx="9" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="480" y="163" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Reasoner</text>
  <text x="480" y="180" text-anchor="middle" font-size="11.5" fill="#6b7280">rule-based strategy selection today, a documented seam for an LLM policy</text>
  <line x1="480" y1="190" x2="480" y2="208" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- IR and genome -->
  <rect x="150" y="210" width="320" height="50" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="310" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Engineering IR</text>
  <text x="310" y="248" text-anchor="middle" font-size="11" fill="#6b7280">the problem: geometry, material, load, constraints, fixed</text>
  <rect x="490" y="210" width="320" height="50" rx="9" fill="#fdf4ff" stroke="#e9d5ff"/>
  <text x="650" y="230" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Design Genome</text>
  <text x="650" y="248" text-anchor="middle" font-size="11" fill="#6b7280">what a search may change: section, topology, CAD</text>
  <line x1="310" y1="260" x2="310" y2="282" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="650" y1="260" x2="650" y2="282" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- capability registry -->
  <rect x="60" y="284" width="840" height="200" rx="11" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="480" y="306" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">Capability Registry: one routing rule for every node</text>
  <text x="480" y="322" text-anchor="middle" font-size="11" fill="#6b7280">a method runs only when it applies to the problem AND its node is available; excluded methods say why</text>

  <rect x="78" y="334" width="262" height="136" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="209" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">In-process engine (43)</text>
  <text x="209" y="372" text-anchor="middle" font-size="10.5" fill="#6b7280">GPU physics on NVIDIA Warp, PyTorch</text>
  <text x="209" y="390" text-anchor="middle" font-size="10.5" fill="#374151">beam, Timoshenko, 3D FEM, fatigue, buckling</text>
  <text x="209" y="406" text-anchor="middle" font-size="10.5" fill="#374151">shafts, bearings, bolts, gears, welds, fits</text>
  <text x="209" y="422" text-anchor="middle" font-size="10.5" fill="#374151">thermal networks, pipe flow, drag, laminates</text>
  <text x="209" y="438" text-anchor="middle" font-size="10.5" fill="#374151">SLSQP, DE, NSGA-II, SIMP topology, generative CAD</text>
  <text x="209" y="456" text-anchor="middle" font-size="10.5" fill="#6b7280">dynamics, statics, motor and gearbox selection</text>

  <rect x="350" y="334" width="262" height="136" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="481" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">External solver nodes (7)</text>
  <text x="481" y="372" text-anchor="middle" font-size="10.5" fill="#6b7280">independent codes over stdio, for cross-checks</text>
  <text x="481" y="390" text-anchor="middle" font-size="10.5" fill="#374151">CalculiX (FEA, general shapes)</text>
  <text x="481" y="406" text-anchor="middle" font-size="10.5" fill="#374151">Code_Aster (plasticity), Elmer (magnetostatics)</text>
  <text x="481" y="422" text-anchor="middle" font-size="10.5" fill="#374151">OpenFOAM (CFD), Gmsh (meshing)</text>
  <text x="481" y="438" text-anchor="middle" font-size="10.5" fill="#374151">Pinocchio, MuJoCo (multibody, contact)</text>
  <text x="481" y="456" text-anchor="middle" font-size="10.5" fill="#6b7280">overlap is cross-validation, not a new capability</text>

  <rect x="622" y="334" width="262" height="136" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="753" y="354" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">CAD knowledge layer (4)</text>
  <text x="753" y="372" text-anchor="middle" font-size="10.5" fill="#6b7280">OpenCASCADE via build123d, no scraped CAD</text>
  <text x="753" y="390" text-anchor="middle" font-size="10.5" fill="#374151">STEP analyzer: geometry, topology, adjacency</text>
  <text x="753" y="406" text-anchor="middle" font-size="10.5" fill="#374151">feature recognition and family classification, by rules</text>
  <text x="753" y="422" text-anchor="middle" font-size="10.5" fill="#374151">parametric shapes to STEP, mass-consistent</text>
  <text x="753" y="438" text-anchor="middle" font-size="10.5" fill="#374151">manufacturability: wall thickness, draft</text>
  <text x="753" y="456" text-anchor="middle" font-size="10.5" fill="#7c3aed">generative design track P3 to P9: first pass done</text>

  <line x1="480" y1="484" x2="480" y2="502" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- funnel -->
  <rect x="60" y="504" width="840" height="78" rx="11" fill="#fefce8" stroke="#fde68a"/>
  <text x="480" y="526" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">Multi-Fidelity Funnel</text>
  <text x="480" y="548" text-anchor="middle" font-size="12" fill="#374151">surrogate SCREENS thousands  &#8594;  beam theory evaluates the shortlist  &#8594;  3D FEM gate  &#8594;  external solver cross-check</text>
  <text x="480" y="568" text-anchor="middle" font-size="11" fill="#b45309">the surrogate ranks and never decides: its output is graded SURROGATE and cannot become a pass or a fail</text>
  <line x1="480" y1="582" x2="480" y2="600" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- verdict -->
  <rect x="60" y="602" width="840" height="70" rx="11" fill="#fef2f2" stroke="#fecaca"/>
  <text x="480" y="624" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">Conjunctive Verdict and Review</text>
  <text x="480" y="644" text-anchor="middle" font-size="12" fill="#374151">every applicable failure mode must pass; one failure fails the assembly; the governing check and its assumption are named</text>
  <text x="480" y="662" text-anchor="middle" font-size="11" fill="#b91c1c">NOT_ASSESSED and SCREENED are gaps, never passes; the reported margin is an upper bound on the real one</text>
  <line x1="480" y1="672" x2="480" y2="690" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- brain -->
  <rect x="60" y="692" width="840" height="170" rx="11" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="480" y="714" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1f2937">Engineering Brain</text>
  <text x="480" y="732" text-anchor="middle" font-size="11" fill="#6b7280">episodic, semantic, strategy, knowledge graph; every statement carries the evidence that supports and contradicts it</text>

  <text x="90" y="762" font-size="11.5" font-weight="600" fill="#1f2937">Evidence ladder</text>
  <text x="870" y="762" text-anchor="end" font-size="10.5" fill="#6b7280">confidence ceiling per level</text>
  <rect x="90" y="770" width="110" height="40" rx="5" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="145" y="787" text-anchor="middle" font-size="10.5" font-weight="600" fill="#374151">UNVERIFIED</text>
  <text x="145" y="802" text-anchor="middle" font-size="10" fill="#6b7280">0.20</text>
  <rect x="204" y="770" width="118" height="40" rx="5" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="263" y="787" text-anchor="middle" font-size="10.5" font-weight="600" fill="#374151">SURROGATE</text>
  <text x="263" y="802" text-anchor="middle" font-size="10" fill="#6b7280">0.40, may not decide</text>
  <rect x="326" y="770" width="110" height="40" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="381" y="787" text-anchor="middle" font-size="10.5" font-weight="600" fill="#374151">SIMULATED</text>
  <text x="381" y="802" text-anchor="middle" font-size="10" fill="#6b7280">0.60</text>
  <rect x="440" y="770" width="120" height="40" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="500" y="787" text-anchor="middle" font-size="10.5" font-weight="600" fill="#374151">REPEATED</text>
  <text x="500" y="802" text-anchor="middle" font-size="10" fill="#6b7280">0.80, independent runs</text>
  <rect x="564" y="770" width="132" height="40" rx="5" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="630" y="787" text-anchor="middle" font-size="10.5" font-weight="600" fill="#374151">HIGH_CONFIDENCE</text>
  <text x="630" y="802" text-anchor="middle" font-size="10" fill="#6b7280">0.95</text>
  <rect x="700" y="770" width="170" height="40" rx="5" fill="#ffffff" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="785" y="787" text-anchor="middle" font-size="9.5" font-weight="600" fill="#6b7280">EXPERIMENTALLY_VALIDATED</text>
  <text x="785" y="802" text-anchor="middle" font-size="10" fill="#6b7280">physical test only, 0.99</text>
  <line x1="90" y1="822" x2="436" y2="822" stroke="#1d4ed8" stroke-width="3"/>
  <text x="90" y="842" font-size="11" fill="#1d4ed8">everything in this repository sits here: nothing has been physically tested, and the code says so</text>

  <!-- loop back -->
  <path d="M900 777 L928 777 L928 167 L680 167" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="940" y="480" text-anchor="middle" font-size="11" fill="#6b7280" transform="rotate(-90 940 480)">learn, update the brain, reason again</text>

  <!-- footer -->
  <text x="480" y="890" text-anchor="middle" font-size="11" fill="#6b7280">GPU profiles 4 GB to 128 GB to cloud   |   SI units throughout   |   simulated is not experimentally validated</text>
  <text x="480" y="912" text-anchor="middle" font-size="11" fill="#6b7280">roadmap: widen the part families and the load cases, then hardware, then measurement</text>
  <text x="480" y="950" text-anchor="middle" font-size="10" fill="#9ca3af">Apache-2.0</text>
</svg>
