  <text x="440" y="401" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">GPU Physics</text>
  <text x="440" y="418" text-anchor="middle" font-size="11.5" fill="#6b7280">Warp</text>
  <rect x="576" y="376" width="240" height="56" rx="9" fill="#fff7ed" stroke="#fdba74"/>
  <text x="696" y="401" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2937">Optimization</text>
  <text x="696" y="418" text-anchor="middle" font-size="11.5" fill="#6b7280">SLSQP + DE</text>

  <rect x="120" y="476" width="640" height="54" rx="9" fill="#eff6ff" stroke="#93c5fd"/>
