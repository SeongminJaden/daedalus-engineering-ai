  <rect x="240" y="208" width="400" height="50" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="440" y="229" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Engineering IR</text>
  <text x="440" y="247" text-anchor="middle" font-size="11.5" fill="#6b7280">problem: geometry · material · load · constraints</text>

  <rect x="240" y="280" width="400" height="50" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
