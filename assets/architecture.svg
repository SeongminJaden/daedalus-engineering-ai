  <rect x="150" y="634" width="580" height="56" rx="9" fill="#faf5ff" stroke="#d8b4fe"/>
  <text x="440" y="659" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2937">Engineering Brain</text>
  <text x="440" y="677" text-anchor="middle" font-size="11.5" fill="#6b7280">episodic · semantic · strategy · knowledge graph · evidence levels</text>

