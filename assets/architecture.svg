<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 760" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Daedalus autonomous engineering loop architecture">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="878" height="758" rx="14" fill="#ffffff" stroke="#e5e7eb"/>
  <text x="440" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Daedalus: Autonomous Engineering Loop</text>

  <rect x="240" y="64" width="400" height="50" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
