[pytest]
# Running the whole suite in parallel is worth about 2.1x, but ONLY the whole
# suite, and only distributed by file. Both halves of that were measured:
#
#   serial                       1383.7 s   1151 passed
#   -n 8 --dist loadfile          646.4 s   1151 passed   (2.14x)
#
# It is deliberately NOT in addopts. Every worker pays its own torch import,
# CUDA context and Warp module load, roughly three seconds, so on anything
# short the startup dominates and parallel is SLOWER. Measured on two GPU
# heavy files: 8.5 s serial against 22.7 s on eight workers, a 2.7x loss.
# Making this a default would quietly punish the single file runs that make up
# most of development.
#
# --dist loadfile rather than the default per test distribution, because
# several modules carry expensive module scoped fixtures: one of them costs
# 107.9 s of setup alone. Splitting a module across workers would make each of
# them pay that again.
#
# The floor is the slowest single FILE, since a file cannot be split. That is
# tests/test_agent_loop.py at 446 s on its own, which is why the whole suite
# lands near 646 s and not near the 173 s that perfect balance would give.
# Going faster means splitting that file, not adding workers.
#
#   full suite      python -m pytest tests/ -q -n 8 --dist loadfile
#   one file        python -m pytest tests/test_x.py -q       (no -n)
markers =
    slow: takes tens of seconds (3D FEM runs)
