# Material property database. All values SI.
#
# EVERY VALUE SAYS WHERE IT CAME FROM. Each material carries `sources`, the
# documents that were read, and `value_sources`, which field came from which
# document at which table, with the number as printed so the SI conversion can
# be checked. Grades:
#   primary    the producer's datasheet or a standard, read in full on the
#              retrieval date
#   secondary  a database or article that restates numbers without attributing
#              them to a measurement (MatWeb, AZoM, MakeItFrom); named so it
#              can be checked, not trusted
#   derived    computed exactly from other stored values
# A value that no document gives is ABSENT (None), never estimated. Fatigue
# strength is None for several entries for exactly that reason, and the
# fatigue methods refuse those materials rather than inventing an endurance
# limit.
#
# The MatWeb pages this file cited in earlier revisions returned HTTP 403 to
# automated retrieval on 2026-09-02 and were not re-read. Values that still
# rest on them are graded secondary and say so. al_7075_t6 in particular keeps
# its MatWeb/MMPDS numbers because every pinned result in this repository
# depends on them; the Kaiser primary numbers, which differ by under one
# percent, are written in its notes.
#
# STATUS is per material: `supplier_datasheet` where the load bearing values
# are primary, `reference_typical` where they are not. Typical values vary
# with temper, product form, thickness and lot; before anything is
# manufactured each value must be re-checked against the datasheet for the
# actual product, and the status upgraded to `measured` only by a test.
#
# service_temperature_k is what the source states as a use range or a
# softening point, in kelvin, or absent where the source states none. It is
# recorded, not enforced. temperature_dependence holds sourced curves only;
# INCONEL 718 has a modulus curve from 294 to 1366 K, nothing else does, and
# nothing here is interpolated from a room temperature value.
#
# fatigue_strength_pa is a representative endurance value (R.R. Moore
# rotating beam, about 5e8 cycles, for the aluminium entries). Aluminium has
# no true endurance limit, so this is a reference point, not a guarantee of
# infinite life.
#
# price_per_kg_usd is RAW MATERIAL only, reference_typical, in USD per kg.
# It is not a part cost and must not be presented as one. Use it to RANK
# materials against each other, not to quote anything. Absent where no
# defensible figure was recorded.

