# Material property database. All values SI.
#
# STATUS / SOURCE ARE PART OF THE SCHEMA ON PURPOSE.
# Every entry here is `reference_typical`: handbook/database TYPICAL values,
# NOT a specific supplier's certified datasheet. Typical values vary with
# temper, product form (plate vs extrusion vs bar), thickness and heat lot.
# Before anything is manufactured, each value must be re-checked against the
# actual supplier datasheet for the actual product form, and the status
# upgraded accordingly. Design decisions made on these numbers carry that
# caveat with them.
#
# SCOPE: this database currently holds ISOTROPIC, linear-elastic METALS only.
# CFRP and 3D-printed plastics are anisotropic and must NOT be added to this
# single-E/single-yield schema - they need the direction-dependent schema and
# the anisotropic solver first (see the material roadmap in DESIGN.md, step 3).
#
# fatigue_strength_pa is a representative endurance value (R.R. Moore rotating
# beam, ~5e8 cycles for these alloys). Aluminium has no true endurance limit,
# so this is a reference point, not a guarantee of infinite life.
#
# thermal_expansion_1_k is the linear coefficient in 1/K, reference_typical at
# room temperature. Two caveats travel with it. It is TEMPERATURE DEPENDENT and
# the single value here is a room-temperature figure, so a large excursion
# needs a curve rather than this number. And the polymer values scatter far
# more than the metal ones, easily +/- 20% between grades and fillers, so treat
# abs/pla/petg/pc/pa12 as order-of-magnitude.
#
# CFRP carries DIRECTIONAL coefficients because a single value would be worse
# than useless there: carbon fibre contracts along its length when heated, so
# alpha_1 is NEGATIVE while alpha_2 across the fibres is large and positive.
#
# price_per_kg_usd is RAW MATERIAL only, reference_typical, in USD per kg.
# VALIDITY: it is not a part cost and must not be presented as one. Machining,
# finishing, assembly, tooling, scrap and quantity discounts are all excluded,
# and for a small machined bracket those dominate the material by an order of
# magnitude. The scatter on the material price itself is also larger than any
# other field here: alloy prices move with commodity markets, form (bar, plate,
# powder) changes them severalfold, and small quantities carry a large premium.
# Use these to RANK materials against each other, not to quote anything.

