# Tier: desktop workstation GPU with ~16 GB VRAM (e.g. RTX 4080 / A4000).
name: desktop_16gb
description: Desktop workstation class. 16 GB VRAM, dedicated to compute.

gpu:
  vram_gb: 16
  reserve_vram_gb: 1.0
  device: cuda

compute:
  max_batch: 24
  amp: true
  dtype: float32
  grad_checkpointing: false

simulation:
  fidelity: medium
  fem_max_dofs: 1200000
  mesh_resolution: 128
  max_substeps: 24
  contact_max_pairs: 524288

optimization:
  candidate_pool: 96
  generations: 100
  checkpoint_every: 10

surrogate:
  enabled: true
  train_batch: 256
  infer_batch: 512

# Compute budget for one autonomous loop run. The loop stops when either
# limit is hit and records which one - an unbounded search is not a design
# process, it is a hang.
budget:
  max_evaluations: 100000
  max_seconds: 900

monitoring:
  refresh_hz: 8
