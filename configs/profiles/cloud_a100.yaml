# Tier: datacenter GPU with 80 GB VRAM (A100 / H100 class).
name: cloud_a100
description: Datacenter class. 80 GB VRAM, no display attached.

gpu:
  vram_gb: 80
  reserve_vram_gb: 2.0
  device: cuda

compute:
  max_batch: 128
  amp: true
  dtype: float32
  grad_checkpointing: false

simulation:
  fidelity: high
  fem_max_dofs: 12000000
  mesh_resolution: 384
  max_substeps: 64
  contact_max_pairs: 4194304

optimization:
  candidate_pool: 512
  generations: 500
  checkpoint_every: 25

surrogate:
  enabled: true
  train_batch: 2048
  infer_batch: 4096
  dataset_samples: 500000

# Compute budget for one autonomous loop run. The loop stops when either
# limit is hit and records which one - an unbounded search is not a design
# process, it is a hang.
budget:
  max_evaluations: 500000
  max_seconds: 3600

monitoring:
  refresh_hz: 10
