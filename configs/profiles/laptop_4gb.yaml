# Tier: single laptop GPU with ~4 GB VRAM (e.g. RTX 3050 Laptop).
# This is the CURRENT default target. Values are deliberately conservative:
# the display server also lives on this GPU, so headroom matters.
name: laptop_4gb
description: RTX 3050 Laptop class. 4 GB VRAM, shared with the desktop compositor.

gpu:
  vram_gb: 4
  reserve_vram_gb: 0.8      # left for compositor/driver; never allocated by us
  device: cuda

compute:
  # Designs per beam kernel launch. Raised from 4 after measuring that the
  # beam path is entirely LAUNCH bound: one launch costs about 19 ms whether
  # it carries 4 designs or 4096, and peak VRAM stays at 123 MiB either way,
  # because a beam evaluation is closed form per design and allocates no mesh.
  # At the old value a 512 design population became 128 launches and took
  # 2171 ms; in one launch it takes 16.5 ms, a measured 131x.
  #
  # Results are BITWISE identical across batch sizes, checked on 300 random
  # designs for mass, stress and deflection, so this is purely a speed change.
  #
  # 256 rather than the 4096 that still showed no memory growth, because 4096
  # is only justified for the path that was measured. This knob also caps any
  # future batched path, and a count is a crude proxy for memory. The 3D FEM
  # path does NOT use it; that is bounded separately by fem_max_dofs.
  max_batch: 256
  amp: true                 # mixed precision on: halves activation memory
  dtype: float32
  grad_checkpointing: true

simulation:
  fidelity: low
  fem_max_dofs: 150000
  mesh_resolution: 48       # voxels along the longest bbox axis
  max_substeps: 8
  contact_max_pairs: 65536

optimization:
  candidate_pool: 16        # designs evaluated per generation
  generations: 20
  checkpoint_every: 5

surrogate:
  enabled: true             # lean on surrogates hard when VRAM is scarce
  train_batch: 32
  infer_batch: 64
  dataset_samples: 20000

# Compute budget for one autonomous loop run. The loop stops when either
# limit is hit and records which one - an unbounded search is not a design
# process, it is a hang.
budget:
  max_evaluations: 20000
  max_seconds: 300

monitoring:
  refresh_hz: 4
