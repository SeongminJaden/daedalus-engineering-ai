# Tier: single laptop GPU with ~4 GB VRAM (e.g. RTX 3050 Laptop).
# This is the CURRENT default target.
#
# WHICH OF THESE KEYS ACTUALLY DO ANYTHING
#
# Measured by searching for consumers, because a profile that advertises
# control it does not have is worse than one with fewer knobs: someone tunes a
# value, measures no change, and concludes the hardware is the limit.
#
#   READ by code:  fem_max_dofs, max_batch, generations, train_batch,
#                  dataset_samples, max_evaluations, max_seconds, refresh_hz
#   READ BY NOTHING: mesh_resolution, max_substeps, contact_max_pairs,
#                  candidate_pool, checkpoint_every, infer_batch,
#                  grad_checkpointing, reserve_vram_gb, amp
#
# The second list is kept rather than deleted because the other profiles
# declare the same keys and the capabilities are planned, but tuning any of
# them today changes nothing. Note that reserve_vram_gb is in that list: the
# headroom this file promises the compositor is documentation, not a limit
# anything enforces.
name: laptop_4gb
description: RTX 3050 Laptop class. 4 GB VRAM, shared with the desktop compositor.

gpu:
  vram_gb: 4
  reserve_vram_gb: 0.8      # left for compositor/driver; never allocated by us
  device: cuda

compute:
  # Designs per beam kernel launch. Raised from 4 after measuring that the
  # beam path is entirely LAUNCH bound: one launch costs about 19 ms whether
  # it carries 4 designs or 4096, and peak VRAM stays at 123 MiB either way,
  # because a beam evaluation is closed form per design and allocates no mesh.
  # At the old value a 512 design population became 128 launches and took
  # 2171 ms; in one launch it takes 16.5 ms, a measured 131x.
  #
  # Results are BITWISE identical across batch sizes, checked on 300 random
  # designs for mass, stress and deflection, so this is purely a speed change.
  #
  # 256 rather than the 4096 that still showed no memory growth, because 4096
  # is only justified for the path that was measured. This knob also caps any
  # future batched path, and a count is a crude proxy for memory. The 3D FEM
  # path does NOT use it; that is bounded separately by fem_max_dofs.
  max_batch: 256
  amp: true                 # mixed precision on: halves activation memory
  dtype: float32
  grad_checkpointing: true

simulation:
  fidelity: low
  # NOT a memory budget on this machine, which is what it looks like. Measured
  # on the 3D FEM: 451,875 DOFs peaked at 253 MiB and 1,482,627 DOFs at
  # 331 MiB, against roughly 3300 MiB usable. Memory would not bind until
  # somewhere near 15 million DOFs. TIME binds long before that, and steeply,
  # because conjugate gradient iterations grow with problem size: 2.4 s, 8.4 s,
  # 25.4 s and 54.8 s for one hollow section cantilever at one, two, three and
  # four elements through the wall.
  #
  # Left at 150000 after measuring what more would buy. Holding the axial
  # count fixed and refining only through the wall, tip deflection moves
  # 2.429 percent, then 0.861, then 0.427. This cap already admits three
  # elements through the wall for a 3 mm section, which is the 0.427 percent
  # point at 25 s. Raising it to admit four costs 55 s for roughly two tenths
  # of a percent. That is a worse tool, not a faster one.
  fem_max_dofs: 150000
  mesh_resolution: 48       # voxels along the longest bbox axis
  max_substeps: 8
  contact_max_pairs: 65536

optimization:
  candidate_pool: 16        # designs evaluated per generation
  generations: 20
  checkpoint_every: 5

surrogate:
  enabled: true             # lean on surrogates hard when VRAM is scarce
  train_batch: 32
  infer_batch: 64
  dataset_samples: 20000

# Compute budget for one autonomous loop run. The loop stops when either
# limit is hit and records which one - an unbounded search is not a design
# process, it is a hang.
budget:
  max_evaluations: 20000
  max_seconds: 300

monitoring:
  refresh_hz: 4
